name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Run test suite
        run: go test -v ./...

      - name: Test cross-compilation (Windows & Linux)
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/bot
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/bot
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/bot
